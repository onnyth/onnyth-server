spring.application.name=onnyth-server

# ==========================================
# Database Configuration (PostgreSQL)
# ==========================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA/Hibernate Config
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# Supabase Configuration
# ==========================================
supabase.url=${SUPABASE_URL:https://your-project.supabase.co}
supabase.anon-key=${SUPABASE_ANON_KEY:your-anon-key}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:${supabase.anon-key}}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:profile-pics}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${supabase.url}/auth/v1

# ==========================================
# Redis Configuration
# ==========================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ==========================================
# Kafka Configuration
# ==========================================
spring.kafka.bootstrap-servers=localhost:9092

# --- Producer ---
# UC-8 / A1: keep max.block.ms short so a broker/metadata outage can't block the calling
# HTTP thread for the 60s default; KafkaBookmarkEventPublisher also catches and logs any
# failure instead of propagating it, so publishing never fails the bookmark creation request.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.acks=1
# Don't leak the producer's internal Java class name to consumers via message headers -
# the topic's published contract (BookmarkCreated) is the only thing consumers should rely on.
spring.kafka.producer.properties.spring.json.add.type.headers=false

# --- Consumer ---
spring.kafka.consumer.group-id=onnyth
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.onnyth.onnythserver.bookmark.domain.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.onnyth.onnythserver.bookmark.domain.event.BookmarkCreated
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# ==========================================
# File Upload Configuration
# ==========================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ==========================================
# Spring Actuator Configuration
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.info.env.enabled=true

# Application info for /actuator/info endpoint
info.app.name=@project.name@
info.app.description=@project.description@
info.app.version=@project.version@

# ==========================================
# Swagger/OpenAPI Configuration
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ==========================================
# Logging Configuration
# ==========================================
logging.level.root=INFO
logging.level.com.onnyth=INFO

