# ==========================================
# Production Profile (Railway)
# ==========================================
# Activated via SPRING_PROFILES_ACTIVE=production env var on Railway

spring.jpa.show-sql=false

# Stricter JPA validation in production
spring.jpa.hibernate.ddl-auto=validate

# Disable Swagger in production (optional — remove if you want API docs in prod)
# springdoc.swagger-ui.enabled=false

# Logging — reduce noise in production
logging.level.root=WARN
logging.level.com.onnyth=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# JSON structured logging (Railway log viewer supports it)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
