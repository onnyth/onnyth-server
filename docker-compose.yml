services:
  postgres:
    image: postgres:16-alpine
    container_name: onnyth-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onnyth_dev}
      POSTGRES_USER: ${POSTGRES_USER:-onnyth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onnyth_password}
    ports:
      - "5432:5432"
    volumes:
      # Persist data across container restarts
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onnyth} -d ${POSTGRES_DB:-onnyth_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - onnyth-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: onnyth-app
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # App expects DATABASE_* placeholders from application.properties
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-onnyth_dev}
      DATABASE_USERNAME: ${POSTGRES_USER:-onnyth}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-onnyth_password}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}

      # Supabase/JWT source config
      SUPABASE_URL: ${SUPABASE_URL:-https://your-project.supabase.co}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-your-anon-key}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-${SUPABASE_ANON_KEY:-your-anon-key}}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-profile-pics}

      # Spring Boot Configuration
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SERVER_PORT: 8080


      # Logging
      LOGGING_LEVEL_COM_ONNYTH: ${LOGGING_LEVEL:-INFO}
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: ${LOGGING_LEVEL:-INFO}

    # Healthcheck - verifies app is responding
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - onnyth-network

volumes:
  postgres_data:
    driver: local

networks:
  onnyth-network:
    driver: bridge