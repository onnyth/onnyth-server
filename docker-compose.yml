services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: onnyth-kafka
    ports:
      - "9092:9092"
    environment:
      # Single-node KRaft mode (no Zookeeper needed)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@onnyth-kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://onnyth-kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: onnyth-app
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    # Lets the container reach the Postgres/API started on the host by `supabase start`
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # App expects DATABASE_* placeholders from application.properties.
      # NOTE: hardcoded to host.docker.internal (not ${DATABASE_URL:-...}) because docker compose
      # also reads .env for substitution, and .env's DATABASE_URL/SUPABASE_URL point at 127.0.0.1
      # for the ./mvnw spring-boot:run (host) workflow - which would resolve to the container
      # itself here, not the host running `supabase start`. Only creds/keys are shared from .env.
      DATABASE_URL: jdbc:postgresql://host.docker.internal:54322/postgres
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}

      # Supabase/JWT source config - keys from `supabase status -o env`, URL hardcoded for the
      # same host.docker.internal reason as DATABASE_URL above
      SUPABASE_URL: http://host.docker.internal:54321
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-your-anon-key}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-${SUPABASE_ANON_KEY:-your-anon-key}}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-profile-pics}

      # Kafka - points at the kafka service on the compose network (not the host workflow's localhost:9092)
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      # Spring Boot Configuration
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SERVER_PORT: 8080


      # Logging
      LOGGING_LEVEL_COM_ONNYTH: ${LOGGING_LEVEL:-INFO}
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: ${LOGGING_LEVEL:-INFO}

    # Healthcheck - verifies app is responding
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  kafka-data: